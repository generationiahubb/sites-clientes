# Gatilho automático (`on: push`) DESATIVADO em 02/09/2026: a conta Cloudflare foi suspensa
# por excesso de deploys automáticos (um deploy por push, multiplicado por pasta de cliente).
# Publicação padrão de mockup agora é só GitHub Pages. Este workflow só roda manualmente
# (aba Actions > Run workflow), e só deve ser usado quando um cliente pagar e for gerar
# domínio próprio / hospedagem definitiva no Cloudflare Pages para aquele site específico.
# Não reative o "on: push" sem pedido explícito do usuário.
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy each site folder to its Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for dir in */; do
            slug="${dir%/}"
            [ "$slug" = ".github" ] && continue
            [ -f "$dir/index.html" ] || continue
            echo "== Deploying $slug =="
            npx --yes wrangler pages project create "$slug" --production-branch=main || true
            npx --yes wrangler pages deploy "$dir" --project-name="$slug" --branch=main
          done
