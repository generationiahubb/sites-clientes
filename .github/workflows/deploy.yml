name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy each site folder to its Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for dir in */; do
            slug="${dir%/}"
            [ "$slug" = ".github" ] && continue
            [ -f "$dir/index.html" ] || continue
            echo "== Deploying $slug =="
            npx --yes wrangler pages deploy "$dir" --project-name="$slug" --branch=main
          done
